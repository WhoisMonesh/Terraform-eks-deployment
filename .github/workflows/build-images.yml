name: Build & Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # needed to push to GHCR
    strategy:
      matrix:
        component: [agent, gui, ollama]
        include:
          - component: agent
            context: .
            dockerfile: devops-ai-copilot/deploy/Dockerfile.agent
            image_name: devops-ai-copilot-agent
          - component: gui
            context: devops-ai-copilot/gui
            dockerfile: devops-ai-copilot/gui/Dockerfile
            image_name: devops-ai-copilot-gui
          - component: ollama
            context: devops-ai-copilot
            dockerfile: devops-ai-copilot/deploy/Dockerfile.ollama
            image_name: devops-ai-copilot-ollama
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-ai-copilot/${{ matrix.image_name }}:latest
            ghcr.io/${{ github.repository_owner }}/devops-ai-copilot/${{ matrix.image_name }}:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64