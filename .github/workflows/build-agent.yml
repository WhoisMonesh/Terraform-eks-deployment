name: Build & Push Agent Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops-ai-copilot/deploy/Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/devops-ai-copilot/devops-ai-copilot-agent:latest
            ghcr.io/${{ github.repository_owner }}/devops-ai-copilot/devops-ai-copilot-agent:sha-${{ github.sha }}
          platforms: linux/amd64,linux/arm64